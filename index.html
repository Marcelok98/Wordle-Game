<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
    <!-- link de google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <hearder>
        <h1>Wordle en español</h1>
        <p>Puedes intentarlo hasta 6 veces</p>
    </hearder>
    <main>
        <p>Ingresa una palabra: </p>
        <input type="text" class="palabra" id="texto" maxlength="5" placeholder="Hasta 5 letras">
        <button id="boton">Intentar</button>
        <button id="botonBorrar">Rendirse</button>
        
        <div id="advertencia"></div>
        <ul id="lista"></ul> 
        <div id="contenedor"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
